name: Run UI-Playwright Tests

on:
  push:
    branches: [ main ]

  pull_request:


jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-testing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: playwright-testing/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers with deps
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - name: Upload Playwright HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-testing/playwright-report/
        retention-days: 30

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: playwright-testing/test-results/
        retention-days: 30
